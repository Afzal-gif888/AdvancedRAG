<rect x="446.1" y="470.4" width="98.0" height="45.0" rx="7" fill="#0b1220" fill-opacity=".82"/><text x="495.1" y="484.4" class="nm" text-anchor="middle">Agent Core</text><text x="495.1" y="497.4" class="sb" text-anchor="middle">plan · prompt</text><text x="495.1" y="509.4" class="sb" text-anchor="middle">citations</text>
