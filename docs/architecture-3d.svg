<rect x="299.1" y="542.6" width="141.9" height="45.0" rx="7" fill="#0b1220" fill-opacity=".82"/><text x="370.0" y="556.6" class="nm" text-anchor="middle">RAG Core</text><text x="370.0" y="569.6" class="sb" text-anchor="middle">parse · chunk · embed</text><text x="370.0" y="581.6" class="sb" text-anchor="middle">hybrid retrieval</text>
<rect x="313.0" y="820.2" width="114.0" height="45.0" rx="7" fill="#0b1220" fill-opacity=".82"/><text x="370.0" y="834.2" class="nm" text-anchor="middle">Neon: app DB</text><text x="370.0" y="847.2" class="sb" text-anchor="middle">users · chats</text><text x="370.0" y="859.2" class="sb" text-anchor="middle">documents · jobs</text>
