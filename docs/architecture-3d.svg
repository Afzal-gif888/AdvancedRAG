<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1215" width="1320" height="1215" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>AdvancedRAG system architecture (isometric 3D view)</title>
<desc>Three stacked floors: Browser and Vercel; Backend, Agent Core, RAG Core and the LLM service; Neon PostgreSQL, Pinecone, Redis, file storage and FreeLLMAPI. Arrows show which service calls which.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172036"/></linearGradient><marker id="h-http" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="h-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="h-wake" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fb923c"/></marker></defs>
<style>.nm{font-size:14px;font-weight:700;fill:#fff}.sb{font-size:10.5px;fill:#cbd5e1}.lnk{font-size:11px;font-weight:600;paint-order:stroke;stroke:#0b1220;stroke-width:4px;stroke-linejoin:round}.zn{font-size:13px;font-weight:700;fill:#e2e8f0;letter-spacing:1.4px}.zs{font-size:10.5px;fill:#94a3b8}.ttl{font-size:27px;font-weight:800;fill:#fff}.sub{font-size:13px;fill:#94a3b8}.lg{font-size:11.5px;fill:#cbd5e1}.ph{font-size:15px;font-weight:700;fill:#fff}.pt{font-size:12.5px;fill:#cbd5e1}.pn{font-size:12.5px;font-weight:800;fill:#0b1220}.pk{font-size:12.5px;font-weight:700;fill:#fff}</style>
