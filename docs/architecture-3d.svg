<rect x="880" y="130" width="400" height="680" rx="14" fill="#0b1220" fill-opacity=".72" stroke="#334155"/>
<text x="904" y="164" class="ph">Follow a request</text>
<circle cx="916" cy="196" r="12" fill="#38bdf8"/><text x="916" y="201" class="pn" text-anchor="middle">1</text>
<text x="940" y="200" class="pk">Upload</text>
<text x="940" y="218" class="pt">Browser → Vercel → Backend. The backend checks the</text>
<text x="940" y="233" class="pt">file, stores it and queues a job.</text>
<circle cx="916" cy="272" r="12" fill="#38bdf8"/><text x="916" y="277" class="pn" text-anchor="middle">2</text>
<text x="940" y="276" class="pk">Index</text>
<text x="940" y="294" class="pt">The worker sends it to RAG Core: parse, chunk,</text>
<text x="940" y="309" class="pt">embed (384-d), chunks to Neon, vectors to</text>
<text x="940" y="324" class="pt">Pinecone.</text>
<circle cx="916" cy="363" r="12" fill="#38bdf8"/><text x="916" y="368" class="pn" text-anchor="middle">3</text>
<text x="940" y="367" class="pk">Ask</text>
<text x="940" y="385" class="pt">The browser sends a question over SSE. The backend</text>
<text x="940" y="400" class="pt">calls Agent Core with the chat history.</text>
<circle cx="916" cy="439" r="12" fill="#38bdf8"/><text x="916" y="444" class="pn" text-anchor="middle">4</text>
<text x="940" y="443" class="pk">Retrieve</text>
<text x="940" y="461" class="pt">Agent Core asks RAG Core: semantic + keyword</text>
<text x="940" y="476" class="pt">search, fused (RRF) and reranked.</text>
<circle cx="916" cy="515" r="12" fill="#38bdf8"/><text x="916" y="520" class="pn" text-anchor="middle">5</text>
<text x="940" y="519" class="pk">Answer</text>
<text x="940" y="537" class="pt">The LLM service streams an answer through</text>
<text x="940" y="552" class="pt">FreeLLMAPI. Agent Core adds real citations.</text>
<circle cx="916" cy="591" r="12" fill="#38bdf8"/><text x="916" y="596" class="pn" text-anchor="middle">6</text>
<text x="940" y="595" class="pk">Stream</text>
<text x="940" y="613" class="pt">The backend saves the message and streams it back</text>
<text x="940" y="628" class="pt">to the browser.</text>
<text x="904" y="671" class="ph">Guarantees</text>
<text x="904" y="697" class="pt">✓  Every document and vector belongs to one user</text>
<text x="904" y="717" class="pt">✓  Ingestion is idempotent and retries are bounded</text>
<text x="904" y="737" class="pt">✓  Ready only after vectors are read back</text>
<text x="904" y="757" class="pt">✓  Internal services need a Bearer token</text>
<rect x="880" y="840" width="400" height="84" rx="10" fill="#0b1220" fill-opacity=".7" stroke="#334155"/>
<line x1="898" y1="862" x2="942" y2="862" stroke="#38bdf8" stroke-width="2.6" marker-end="url(#h-http)"/><text x="954" y="866" class="lg">Call between services (HTTPS, SSE, Bearer token)</text>
<line x1="898" y1="884" x2="942" y2="884" stroke="#34d399" stroke-width="2.6" marker-end="url(#h-data)"/><text x="954" y="888" class="lg">Reads and writes a data store</text>
<line x1="898" y1="906" x2="942" y2="906" stroke="#fb923c" stroke-width="2.6" stroke-dasharray="6 5" marker-end="url(#h-wake)"/><text x="954" y="910" class="lg">Wake relay: outside traffic wakes sleeping services</text>
<text x="40" y="1187" class="sub">Embeddings: BAAI/bge-small-en-v1.5 (384 dims) run inside RAG Core; no external embedding API.</text>
</svg>