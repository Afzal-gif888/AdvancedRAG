[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advancerag-common"
version = "1.0.0"
description = "Observability, internal auth and error helpers shared by AdvancedRAG internal services (agent-core, rag-core, llm)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["advancerag_common*"]
